name: tpecia
x-app: &app
  image: tpecia:${TPEC_RELEASE:-local}
  build:
    context: .
    args:
      VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:?set public build URL}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY:?set public build key}
      VITE_SUPABASE_PROJECT_ID: ${VITE_SUPABASE_PROJECT_ID:?set public project ID}
  env_file: ${TPEC_ENV_FILE:-.env}
  init: true
  restart: unless-stopped
  stop_grace_period: 27m
  read_only: true
  tmpfs:
    - /tmp:size=512m,mode=1777
  volumes:
    - jobs:/var/lib/tpecia
  security_opt:
    - no-new-privileges:true
  cap_drop: [ALL]
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "5" }

services:
  web:
    <<: *app
    environment:
      TPEC_RUNTIME: node
      TPEC_DATA_DIR: /var/lib/tpecia
      HOST: 0.0.0.0
      PORT: 3000
      NO_PROXY: "web,127.0.0.1,localhost,${NO_PROXY:-}"
    expose: ["3000"]
  worker:
    <<: *app
    command: ["node", "scripts/worker.mjs"]
    environment:
      TPEC_RUNTIME: node
      TPEC_DATA_DIR: /var/lib/tpecia
      TPEC_INTERNAL_ORIGIN: http://web:3000
      NO_PROXY: "web,127.0.0.1,localhost,${NO_PROXY:-}"
    depends_on:
      web: { condition: service_healthy }
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "import('./src/lib/runtime/queue.server.ts').then(({jobQueue})=>{const q=jobQueue();const ok=q.stats().workerHealthy;q.close();process.exit(ok?0:1)})",
        ]
      interval: 30s
      timeout: 5s
      start_period: 90s
  proxy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      ACME_EMAIL: ${ACME_EMAIL:?set certificate contact email}
      TPEC_UPSTREAM: web:3000
      NO_PROXY: "web,127.0.0.1,localhost,${NO_PROXY:-}"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web: { condition: service_healthy }
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

volumes:
  jobs:
  caddy_data:
  caddy_config:
