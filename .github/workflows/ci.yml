name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, chatgpt-first-tpec]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_ENV: test
      # Placeholders públicos usados apenas para permitir que módulos de build
      # sejam inicializados. Testes unitários mockam as chamadas externas.
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_test_placeholder
      VITE_SUPABASE_PROJECT_ID: example
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_test_placeholder
      SUPABASE_PROJECT_ID: example
      DUKAMP_SITE_SUPABASE_URL: https://example.supabase.co
      DUKAMP_SITE_SUPABASE_ANON_KEY: sb_publishable_test_placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run unit tests
        run: npm test
      - name: Build production bundle
        run: npm run build
