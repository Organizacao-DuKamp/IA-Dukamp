name: Autofix Weather PR33

on:
  push:
    branches:
      - feat/weather-intelligence-v2

permissions:
  contents: write

jobs:
  autofix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Apply ESLint and Prettier fixes
        run: npm run lint -- --fix || true

      - name: Fix remaining regex lint issue
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("src/lib/chat/weather-intelligence.server.ts")
          text = path.read_text(encoding="utf-8")
          old = r"/^[\s\n]*[\[{]/"
          new = r"/^[\s\n]*[[{]/"
          if old in text:
              text = text.replace(old, new, 1)
              path.write_text(text, encoding="utf-8")
          PY

      - name: Verify lint
        run: npm run lint

      - name: Commit formatting fixes
        shell: bash
        run: |
          git add \
            src/lib/chat/weather-analysis.ts \
            src/lib/chat/weather-consensus.ts \
            src/lib/chat/weather-intelligence.server.ts \
            tests/weather-consensus.test.ts \
            tests/weather-intelligence.test.ts
          if git diff --cached --quiet; then
            echo "No formatting changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style: format weather intelligence"
          git push origin HEAD:feat/weather-intelligence-v2
