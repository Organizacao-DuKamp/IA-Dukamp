name: Format Deep Research

on:
  push:
    branches:
      - feat/deep-research-tpec-ia

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/deep-research-tpec-ia
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Format changed research files
        run: npx prettier --write src/lib/chat/perplexity.server.ts tests/deep-research.test.ts
      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No formatting changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/chat/perplexity.server.ts tests/deep-research.test.ts
          git commit -m "style: format deep research files"
          git push origin HEAD:feat/deep-research-tpec-ia
