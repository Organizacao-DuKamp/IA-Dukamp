name: Fix Weather Location Context

on:
  push:
    branches:
      - fix/whatsapp-weather-location-context

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/whatsapp-weather-location-context

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Patch weather follow-up recovery
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          weather = Path('src/lib/chat/weather.ts')
          text = weather.read_text(encoding='utf-8')
          old = 'const WEATHER_PENDING_RE = /consultar_previsao_tempo/i;\n'
          new = '''const WEATHER_PENDING_RE = /consultar_previsao_tempo/i;\nconst WEATHER_LOCATION_PROMPT_RE =\n  /\\bqual\\s+(?:é\\s+)?(?:a\\s+sua\\s+)?cidade[\\s\\S]{0,100}(?:estado|uf)\\b|\\bcidade[\\s\\S]{0,50}(?:estado|uf)\\b/i;\n'''
          if old not in text:
              raise SystemExit('weather pending marker not found')
          text = text.replace(old, new, 1)

          old = '''export function resolveWeatherTurn(text: string, state: ConversationState): WeatherTurnResolution {\n  const direct = isWeatherRequest(text);\n  const pending =\n    WEATHER_PENDING_RE.test(state.pending_action ?? "") ||\n    /qual\\s+cidade[\\s\\S]*estado|cidade\\s+e\\s+(?:estado|uf)/i.test(state.pending_question ?? "");\n  const topic = WEATHER_TOPIC_RE.test(state.current_topic ?? "");\n'''
          new = '''export function isWeatherLocationPrompt(text: string | null | undefined): boolean {\n  return Boolean(text && WEATHER_LOCATION_PROMPT_RE.test(text));\n}\n\nexport function resolveWeatherTurn(\n  text: string,\n  state: ConversationState,\n  lastAssistantText?: string | null,\n): WeatherTurnResolution {\n  const direct = isWeatherRequest(text);\n  const pending =\n    WEATHER_PENDING_RE.test(state.pending_action ?? "") ||\n    isWeatherLocationPrompt(state.pending_question) ||\n    isWeatherLocationPrompt(lastAssistantText);\n  const topic = WEATHER_TOPIC_RE.test(state.current_topic ?? "");\n'''
          if old not in text:
              raise SystemExit('resolveWeatherTurn block not found')
          weather.write_text(text.replace(old, new, 1), encoding='utf-8')

          core = Path('src/lib/chat/core.server.ts')
          text = core.read_text(encoding='utf-8')
          old = '''  const analysis = classifyUserIntent(text, stateBefore);\n  let domainIntent = classifyDomainIntent(text, history.length > 0);\n  const weatherTurn = resolveWeatherTurn(text, stateBefore);\n  const state = applyUserTurn(stateBefore, text, analysis);\n  state.conversation_summary = updateSummary(state, windowed.dropped);\n\n  const lastAssistant = [...history].reverse().find((m) => m.role === "assistant");\n  const lastUser = [...history].reverse().find((m) => m.role === "user");\n'''
          new = '''  const lastAssistant = [...history].reverse().find((m) => m.role === "assistant");\n  const lastUser = [...history].reverse().find((m) => m.role === "user");\n\n  const analysis = classifyUserIntent(text, stateBefore);\n  let domainIntent = classifyDomainIntent(text, history.length > 0);\n  const weatherTurn = resolveWeatherTurn(text, stateBefore, lastAssistant?.content ?? null);\n  const state = applyUserTurn(stateBefore, text, analysis);\n  state.conversation_summary = updateSummary(state, windowed.dropped);\n'''
          if old not in text:
              raise SystemExit('core initialization block not found')
          core.write_text(text.replace(old, new, 1), encoding='utf-8')

          tests = Path('tests/weather-intent.test.ts')
          text = tests.read_text(encoding='utf-8')
          anchor = '''test("continuação como e amanhã reutiliza a última localização meteorológica", () => {\n'''
          addition = '''test("pergunta de localização exata funciona mesmo se só pending_question sobreviver", () => {\n  const state = createConversationState("weather-pending-question-only");\n  state.pending_question = WEATHER_LOCATION_QUESTION;\n  state.awaiting_user_response = true;\n\n  const resolved = resolveWeatherTurn("Monte aprazivel", state);\n  assert.equal(resolved.isWeatherTurn, true);\n  assert.equal(resolved.location, "Monte aprazivel");\n});\n\ntest("histórico recupera cidade enviada após pergunta de clima quando state chega vazio", () => {\n  const state = createConversationState("weather-history-recovery");\n\n  const resolved = resolveWeatherTurn("Monte aprazivel", state, WEATHER_LOCATION_QUESTION);\n  assert.equal(resolved.isWeatherTurn, true);\n  assert.equal(resolved.location, "Monte aprazivel");\n  assert.equal(resolved.usedRememberedLocation, false);\n});\n\n'''
          if anchor not in text:
              raise SystemExit('weather test anchor not found')
          tests.write_text(text.replace(anchor, addition + anchor, 1), encoding='utf-8')

          memory = Path('tests/whatsapp-memory-store.test.ts')
          text = memory.read_text(encoding='utf-8')
          anchor = '''    assert.equal(seen[1]?.channel, "whatsapp");\n    assert.deepEqual(seen[1]?.history, [\n'''
          replacement = '''    assert.equal(seen[1]?.channel, "whatsapp");\n    assert.deepEqual(seen[1]?.state, { current_topic: "teste", turn_count: 1 });\n    assert.deepEqual(seen[1]?.history, [\n'''
          if anchor not in text:
              raise SystemExit('whatsapp memory test anchor not found')
          memory.write_text(text.replace(anchor, replacement, 1), encoding='utf-8')
          PY

      - name: Install dependencies
        run: npm install

      - name: Format and validate focused tests
        run: |
          npx prettier --write src/lib/chat/weather.ts src/lib/chat/core.server.ts tests/weather-intent.test.ts tests/whatsapp-memory-store.test.ts
          npm test -- --test-name-pattern="meteor|tempo|clima|WhatsApp usa memória|weather|localização|localizacao|previsão"
          npm run lint

      - name: Commit fix
        shell: bash
        run: |
          git add src/lib/chat/weather.ts src/lib/chat/core.server.ts tests/weather-intent.test.ts tests/whatsapp-memory-store.test.ts
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: preserve weather context after location prompt"
          git push origin HEAD:fix/whatsapp-weather-location-context
