name: Apply DuKamp full catalog

on:
  push:
    branches: [dukamp-full-catalog-context]
    paths:
      - .github/workflows/apply-dukamp-full-catalog.yml
      - scripts/apply-dukamp-full-catalog.mjs
      - scripts/fix-apply-dukamp-full-catalog.mjs
      - scripts/fix-apply-dukamp-full-catalog-v2.mjs
      - scripts/finalize-dukamp-full-catalog.mjs
      - scripts/finalize-dukamp-full-catalog-v2.mjs
      - scripts/snapshot-dukamp-public-catalog.mjs
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dukamp-full-catalog-context
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Download public DuKamp catalog snapshot
        run: node scripts/snapshot-dukamp-public-catalog.mjs
      - name: Fix temporary integration validator
        run: node scripts/fix-apply-dukamp-full-catalog.mjs
      - name: Fix duplicated integration anchor
        run: node scripts/fix-apply-dukamp-full-catalog-v2.mjs
      - name: Apply catalog intelligence changes
        run: node scripts/apply-dukamp-full-catalog.mjs
      - name: Keep snapshot separate from live availability
        run: node scripts/finalize-dukamp-full-catalog.mjs
      - name: Preserve live source status with snapshot fallback
        run: node scripts/finalize-dukamp-full-catalog-v2.mjs
      - name: Format changed files
        run: npx prettier --write src/lib/site/site-lookup.server.ts src/lib/site/dukamp-catalog.snapshot.ts src/lib/chat/core.server.ts src/lib/chat/intent.ts src/lib/chat/system-prompt.ts tests/site-commercial.test.ts scripts/snapshot-dukamp-public-catalog.mjs
      - name: Audit privileged imports
        run: npm run audit:privileged
      - name: Diagnose commercial tests
        shell: bash
        run: |
          set +e
          npx tsx --test tests/site-commercial.test.ts > debug-site-commercial.txt 2>&1
          status=$?
          cat debug-site-commercial.txt
          if [ "$status" -ne 0 ]; then
            git config user.name "Eduardoo"
            git config user.email "137733778+Eduardoo8442@users.noreply.github.com"
            git add debug-site-commercial.txt
            git commit -m "ci: registrar falha temporária do catálogo DuKamp"
            git push origin HEAD:dukamp-full-catalog-context
            exit "$status"
          fi
          rm -f debug-site-commercial.txt
      - name: Test
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Build Netlify preset
        env:
          NITRO_PRESET: netlify
          TPEC_BACKEND_MODE: proxy
          LOVABLE_BACKEND_URL: https://example.lovable.app
          TPEC_PROXY_SECRET: ci-only-secret-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
        run: npm run build
      - name: Commit validated implementation
        run: |
          git config user.name "Eduardoo"
          git config user.email "137733778+Eduardoo8442@users.noreply.github.com"
          git add src/lib/site/site-lookup.server.ts src/lib/site/dukamp-catalog.snapshot.ts src/lib/chat/core.server.ts src/lib/chat/intent.ts src/lib/chat/system-prompt.ts tests/site-commercial.test.ts scripts/snapshot-dukamp-public-catalog.mjs
          git diff --cached --quiet && exit 0
          git commit -m "feat: incorporar catálogo completo da DuKamp na TPEC-IA"
          git push origin HEAD:dukamp-full-catalog-context
