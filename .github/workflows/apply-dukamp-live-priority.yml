name: Apply DuKamp live priority

on:
  push:
    branches: [dukamp-live-priority]
    paths:
      - .github/workflows/apply-dukamp-live-priority.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dukamp-live-priority
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Normalize temporary migration anchor
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("scripts/apply-dukamp-live-priority.mjs")
          s = p.read_text()
          start = s.index('  const stopwordEnd = `')
          end = s.index('  source = source.replaceAll(', start)
          replacement = '''  const stopwordEnd = `]);\n\nexport function siteIntentHints(text: string) {`;
            source = replaceOnce(
              source,
              stopwordEnd,
              `]);\n\nconst PRODUCT_SELECT =\n  "id,name,code,slug,price,active,stock,featured,description,images,brand,consumer_price,consumer_pix_price,producer_price,producer_pix_price,reseller_price,reseller_pix_price,installments,on_sale,sale_consumer_price,sale_consumer_pix_price";\nconst PRODUCT_FALLBACK_SELECT = "id,name,code,slug,price,active,stock,featured";\n\nexport function siteIntentHints(text: string) {`,
              "product selects",
            );

          '''
          p.write_text(s[:start] + replacement + s[end:])
          PY
      - name: Apply live-first integration
        run: node scripts/apply-dukamp-live-priority.mjs
      - name: Restrict outbound product images to official DuKamp hosts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("src/lib/whatsapp/enhanced-http.server.ts")
          s = p.read_text()
          old = '      if (!/^https:$/.test(url.protocol)) continue;\n      if (!/\\.(?:jpe?g|png|webp|gif)$/i.test(url.pathname)) continue;'
          new = '      if (!/^https:$/.test(url.protocol)) continue;\n      const officialDuKampHost =\n        url.hostname === "pioyrbcdprnplhcoyzam.supabase.co" ||\n        url.hostname === "dukamp.com.br" ||\n        url.hostname.endsWith(".dukamp.com.br");\n      if (!officialDuKampHost) continue;\n      if (!/\\.(?:jpe?g|png|webp|gif)$/i.test(url.pathname)) continue;'
          if old not in s:
              raise SystemExit("official image anchor not found")
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Format changed files
        run: npx prettier --write src/lib/site/dukamp-product-ranking.ts src/lib/site/site-lookup.server.ts src/lib/chat/core.server.ts src/lib/chat/intent.ts src/lib/chat/system-prompt.ts src/lib/whatsapp/enhanced-http.server.ts tests/dukamp-live-priority.test.ts src/lib/chat/model-router.ts src/lib/chat/openai.server.ts src/lib/chat/perplexity.server.ts tests/whatsapp-search-quality.test.ts
      - name: Audit privileged imports
        run: npm run audit:privileged
      - name: Test
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Build Netlify preset
        env:
          NITRO_PRESET: netlify
          TPEC_BACKEND_MODE: proxy
          LOVABLE_BACKEND_URL: https://example.lovable.app
          TPEC_PROXY_SECRET: ci-only-secret-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
        run: npm run build
      - name: Commit validated implementation
        run: |
          git config user.name "Eduardoo"
          git config user.email "137733778+Eduardoo8442@users.noreply.github.com"
          git add src/lib/site/dukamp-product-ranking.ts src/lib/site/site-lookup.server.ts src/lib/chat/core.server.ts src/lib/chat/intent.ts src/lib/chat/system-prompt.ts src/lib/whatsapp/enhanced-http.server.ts tests/dukamp-live-priority.test.ts src/lib/chat/model-router.ts src/lib/chat/openai.server.ts src/lib/chat/perplexity.server.ts tests/whatsapp-search-quality.test.ts
          git commit -m "feat: priorizar catálogo vivo da DuKamp na TPEC-IA"
          git push origin HEAD:dukamp-live-priority
