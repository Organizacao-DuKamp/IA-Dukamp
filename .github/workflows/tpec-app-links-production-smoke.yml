name: TPEC-IA App Links HTTP smoke

'on':
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  verify-assetlinks:
    runs-on: ubuntu-latest
    steps:
      - name: Verify public JSON endpoint
        run: |
          set -euo pipefail
          for i in $(seq 1 36); do
            code="$(curl --max-time 15 --silent --show-error --location --output /tmp/assetlinks.json --write-out '%{http_code}' https://www.tpecia.com.br/.well-known/assetlinks.json || true)"
            if [ "$code" = "200" ] && jq -e 'type == "array"' /tmp/assetlinks.json >/dev/null 2>&1; then
              echo "assetlinks.json returned HTTP 200 with a JSON array"
              cat /tmp/assetlinks.json
              exit 0
            fi
            echo "HTTP $code; retry $i/36"
            sleep 10
          done
          exit 1
